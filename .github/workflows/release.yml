name: Release

# Builds Powder for Apple silicon and for Intel, signs both with the Developer ID, and notarizes them
# when the Apple credentials are set. Runs when a version tag is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
          - arch: x86_64
            label: intel
    env:
      POWDER_ARCH: ${{ matrix.arch }}
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        if: matrix.arch == 'arm64'
        run: swift test

      - name: Install the signing certificate
        run: |
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "::error::The DEVELOPER_ID_P12 secret is not set."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign and notarize
        run: |
          archive="$(./Scripts/release.sh | tail -n 1)"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          if [[ "$archive" == *unnotarized* ]]; then
            echo "::warning::${{ matrix.label }}: signed but not notarized. Set APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Powder-${{ matrix.label }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" builds/*.zip --repo "$GITHUB_REPOSITORY" --title "Powder $GITHUB_REF_NAME" --generate-notes
